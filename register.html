<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="register-overlay">
        <div class="register-box">

            <p class="register-sub">JOIN THE LIBRARY</p>

            <h1>Create your<br>account.</h1>

            <p class="register-desc">
                Your account is stored locally in this browser for this frontend project.
            </p>

            <label>Name</label>
            <input type="text" id="name_register" placeholder="Thor Odinson" class="register_name">
            <label>E-mail</label>
            <input type="email"  id="email_register" placeholder="you@example.com" class="register_email">
            <label>Password</label>
            <input type="password"  id="pass_register" placeholder="At least 4 characters" class="register_pass">
            <p id="msg_box"></p>
            <button class="register-submit">
                Create account
            </button>
            <a href="Main.html">
                <button class="back_main">
                    ← Back to main hall
                </button>
            </a>

            <p class="register-login">
                Already registered?
                <a href="login.html">Log in</a>
            </p>

        </div>
    </div>
    <script src="register.js"></script>
</body>

</html>
