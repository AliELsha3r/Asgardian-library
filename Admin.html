<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>King of Asgard | Asgardian Library</title>
    <link rel="stylesheet" href="Style.css" />
  </head>
  <body id="admin_body">
    <main class="admin-shell">
      <header class="admin-hero">
        <div>
          <p class="golden_txt">THE ROYAL ARCHIVES</p>
          <h1>Welcome back,<br />Your Majesty.</h1>
          <p class="admin-intro">Add new legends to the shelves or remove volumes no longer kept in Asgard.</p>
        </div>
        <a class="Admin_home" href="Home.html">← Back to the Library</a>
      </header>

      <section class="admin-grid" aria-label="Library management">
        <form id="book-form" class="admin-panel">
          <p class="golden_txt">PLACE A NEW VOLUME</p>
          <h2>Add a book</h2>
          <label for="book-title">Book title</label>
          <input id="book-title" name="title" type="text" maxlength="60" required placeholder="e.g. The Raven's Oath" />
          <label for="book-subtitle">Chronicle or collection</label>
          <input id="book-subtitle" name="subtitle" type="text" maxlength="60" required placeholder="e.g. Tales from Midgard" />
          <label for="book-author">Author or keeper</label>
          <input id="book-author" name="author" type="text" maxlength="60" required placeholder="e.g. The Royal Scribe" />
          <label for="book-link">Book link</label>
          <input id="book-link" name="link" type="url" required placeholder="https://example.com/book" />
          <label for="book-rune">Rune <span>(optional)</span></label>
          <input id="book-rune" name="rune" type="text" maxlength="3" placeholder="ᛉ" />
          <button class="admin-submit" type="submit">Add to the library</button>
          <p id="admin-message" class="admin-message" role="status" aria-live="polite"></p>
        </form>

        <section class="admin-panel admin-inventory">
          <p class="golden_txt">THE CURRENT COLLECTION</p>
          <h2>Manage books</h2>
          <p class="admin-intro">Removing a volume also clears it from saved favorites.</p>
          <ul id="admin-book-list" class="admin-book-list"></ul>
        </section>
      </section>
    </main>
    <script src="Library.js"></script>
    <script src="Admin.js"></script>
  </body>
</html>
