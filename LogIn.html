    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Log In | Asgardian Library</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body id="login_page">
        <h3 class="login_header">
        Welcome, citizen of Asgard.
        </h3>
        <div class="login_info">
            <form>
                <label id="text_email" name="email" >EMAIL</label><br>
                <input id="email" name="email" type="email" placeholder="you@example.com"><br><br>
                <label id="text_pass"name="pass"> password</label><br>
                <input id="pass" name="pass" type="password" placeholder="•••••••"><br><br>
                <button type="submit" id="sub_btn">
                    Enter To Asgard
                </button>
            </form>

        </div>
        <a href="Main.html">
            <button id="back_main">
                back to main page
            </button>
        </a>

        <script src ="LogIn.js"></script>
    </body>
    </html>
